# Publication sur GitHub Pages (ADR 0003) : à chaque push sur main, uniquement si la compilation et les tests passent.
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_HREF: /tourneeveto/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore TourneeVeto.slnx

      - name: Compilation
        run: dotnet build TourneeVeto.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test TourneeVeto.slnx -c Release --no-build

      - name: Publication
        run: dotnet publish src/TourneeVeto.Web/TourneeVeto.Web.csproj -c Release -o publish --no-restore

      - name: Préparation GitHub Pages (base href, 404.html, .nojekyll, empreinte du service worker)
        run: python3 scripts/prepare-github-pages.py publish/wwwroot "$BASE_HREF"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
